# dbsync-manager: manager + optional PostGIS (design §10).
#
# Copy .env.example to .env and fill it in.
#
# The postgis service is behind a profile, so it only exists when asked for:
#   existing PostGIS server:  docker compose up -d
#                             (DATABASE_URL points at your own server)
#   bundled PostGIS:          docker compose --profile postgis up -d
#                             (or COMPOSE_PROFILES=postgis in .env)
# Nothing in this file needs editing for either case. Requires Docker
# Compose 2.20+ for `required: false`.

services:
  manager:
    build:
      context: .
      args:
        # Newer pg_dump for a scheduled backup (docs/backup.md); empty = distribution client.
        PG_CLIENT_MAJOR: ${PG_CLIENT_MAJOR:-}
    image: dbsync-manager:local
    restart: unless-stopped
    env_file: .env
    # A stop waits for the supervisor, which waits for every daemon to finish
    # its current pull or push (up to 120 s). Docker's default of 10 s
    # SIGKILLed daemons mid-pull and left checkouts that only Re-init repairs
    # (review note 2026-10-20b).
    stop_grace_period: 150s
    ports:
      # Address and port on the host come from .env; 8080 is a common default
      # and is often taken on a server that runs anything else.
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    depends_on:
      postgis:
        condition: service_healthy
        # Ignored when the postgis profile is not active, so the manager
        # starts on its own against an external database.
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgis:
    image: postgis/postgis:16-3.4
    profiles: ["postgis"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Not `:?`: Compose interpolates every service, also those in inactive
      # profiles, so a hard requirement here would stop installations that
      # use their own server. The image itself refuses an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      # Roles created by docker/postgis-init/20-manager.sh when the data
      # volume is first created: the registry role (DATABASE_URL in .env uses
      # the same password) and the sync role for the first Database row.
      MANAGER_DB_PASSWORD: ${MANAGER_DB_PASSWORD:-}
      SYNC_DB_ROLE: ${SYNC_DB_ROLE:-dbsync_sync}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:-}
      # ICU collation so sorting is locale-correct regardless of the host
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=sv-SE --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # One file, not the directory: a directory mount masks the image's own
      # 10_postgis.sh and the postgis extension is never created (2026-09-28).
      - ./docker/postgis-init/20-manager.sh:/docker-entrypoint-initdb.d/20-manager.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gis}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- database-backed tests (design §13): docker compose --profile test run --rm test
  postgis-test:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    volumes:
      - ./docker/test/init.sql:/docker-entrypoint-initdb.d/10-manager-test.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    build: .
    image: dbsync-manager:local
    profiles: ["test"]
    user: manager
    working_dir: /app
    # Bypasses the s6 entrypoint (which would run migrate) and runs the whole
    # suite, including the `db`-tagged tests, against postgis-test as the
    # non-superuser role manager_test.
    entrypoint: ["python", "manage.py", "test", "--noinput"]
    environment:
      DJANGO_SECRET_KEY: test-only
      DBSYNC_MANAGER_SECRET_KEY: ZGJzeW5jLW1hbmFnZXItdGVzdC1vbmx5LWtleS0wMzI=
      DATABASE_URL: postgres://manager_test:test@postgis-test:5432/manager_test
      DBSYNC_DATA_DIR: /tmp/dbsync-test
    depends_on:
      postgis-test:
        condition: service_healthy

volumes:
  data:
  pgdata:
