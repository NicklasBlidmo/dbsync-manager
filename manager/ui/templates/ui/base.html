{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}dbsync-manager{% endblock %}</title>
<script src="{% static 'ui/htmx.min.js' %}" defer></script>
<style>
:root {
  --bg: #fff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb; --panel: #f6f8fa;
  --ok: #1a7f37; --ok-bg: #dafbe1; --info: #0969da; --info-bg: #ddf4ff;
  --warn: #9a6700; --warn-bg: #fff8c5; --bad: #cf222e; --bad-bg: #ffebe9;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --panel: #161b22;
  --ok: #3fb950; --ok-bg: #12261e; --info: #58a6ff; --info-bg: #0c2d6b;
  --warn: #d29922; --warn-bg: #3b2e00; --bad: #f85149; --bad-bg: #490202;
} }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
header { display: flex; align-items: center; gap: 1.5rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font-weight: 600; text-decoration: none; color: var(--fg); }
header nav a { color: var(--muted); text-decoration: none; margin-right: 1rem; }
header .user { margin-left: auto; color: var(--muted); }
header form { display: inline; }
main { padding: 1rem; max-width: 1200px; }
h1 { font-size: 1.3rem; margin: 0 0 1rem; }
h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .85rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
a { color: var(--info); }
.badge { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; font-size: .8rem; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.muted { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.muted { color: var(--muted); }
.panel { border: 1px solid var(--line); border-radius: .4rem; padding: .8rem 1rem; margin: .5rem 0; background: var(--panel); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .8rem; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: .4rem; padding: .6rem; overflow: auto; max-height: 28rem; font-size: .8rem; white-space: pre-wrap; margin: 0; }
.logbox { height: 28rem; overflow: auto; border: 1px solid var(--line); border-radius: .4rem; background: var(--panel); }
.logbox pre { border: 0; max-height: none; overflow: visible; }
button, .button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--line); border-radius: .3rem; background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; }
button[disabled] { opacity: .5; cursor: not-allowed; }
form.inline { display: inline; margin-right: .4rem; }
.filters label { margin-right: 1rem; }
.filters select { font: inherit; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.notice { padding: .5rem .8rem; border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: .2rem; margin: .4rem 0; }
.notice.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.login { max-width: 22rem; margin: 4rem auto; }
.login input { width: 100%; padding: .4rem; margin: .2rem 0 .8rem; font: inherit; }
@media (max-width: 700px) { main { padding: .6rem; } th, td { padding: .3rem .4rem; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="{% url 'home' %}">dbsync-manager</a>
  <nav>
    <a href="{% url 'home' %}">Projects</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Settings (admin)</a>{% endif %}
  </nav>
  {% if user.is_authenticated %}
  <span class="user">{{ user.get_username }}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
  </span>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
