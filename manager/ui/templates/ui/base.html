{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}dbsync-manager{% endblock %}</title>
<link rel="stylesheet" href="{% static 'ui/app.css' %}">
<script src="{% static 'ui/htmx.min.js' %}" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{% url 'home' %}">dbsync-manager</a>
  <nav>
    <a href="{% url 'home' %}">Projects</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Settings (admin)</a>{% endif %}
  </nav>
  {% if user.is_authenticated %}
  <span class="user">{{ user.get_username }}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
  </span>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
